
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Numbers 1–10 | Boston English Center</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script>
    let initialTheme;

    try {
      if (window.parent !== window) {
        initialTheme =
          window.parent.document.documentElement.classList.contains("dark")
            ? "dark" : "light";
      }
    } catch {}

    if (!initialTheme) {
      try {
        initialTheme =
          localStorage.getItem("editor-theme-preference");
      } catch {}
    }

    if (!initialTheme) {
      initialTheme =
        matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
    }

    document.documentElement.classList.toggle(
      "dark",
      initialTheme === "dark"
    );

    window.setTheme = function (theme) {
      document.documentElement.classList.toggle(
        "dark",
        theme === "dark"
      );
    };
  </script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;

      --page: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #d9e0ed;

      --heading-start: #384fc7;
      --heading-end: #2769cd;

      --accent: #4f46e5;
      --selected-bg: #eef2ff;
      --selected-border: #6366f1;
    }

    :root.dark {
      color-scheme: dark;

      --page: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: #34405f;

      --heading-start: #6861f4;
      --heading-end: #3c79f4;

      --accent: #a5b4fc;
      --selected-bg: #252e50;
      --selected-border: #818cf8;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--page);
      color: var(--text);
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    .slide {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100dvh;

      padding:
        clamp(24px, 4vh, 48px)
        clamp(16px, 4vw, 50px);

      background:
        radial-gradient(
          circle at 5% 5%,
          rgba(79, 70, 229, .08),
          transparent 34%
        ),
        var(--page);
    }

    .dark .slide {
      background:
        radial-gradient(
          circle at 5% 5%,
          rgba(99, 102, 241, .17),
          transparent 34%
        ),
        var(--page);
    }

    .content {
      width: 100%;
      max-width: 1020px;
      margin: auto;
    }

    /* Heading */

    .header {
      text-align: center;
      margin-bottom: clamp(24px, 4vh, 38px);
    }

    .practice-label {
      margin: 0 0 10px;

      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;

      background: linear-gradient(
        100deg,
        var(--heading-start),
        var(--heading-end)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      font-size: clamp(40px, 5.6vw, 72px);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 13px auto 0;
      max-width: 750px;

      color: var(--text);
      font-size: clamp(16px, 1.55vw, 20px);
      font-weight: 600;
      line-height: 1.6;
    }

    .subtitle strong {
      font-weight: 800;
    }

    /* Numbers grid */

    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(12px, 1.5vw, 18px);
    }

    .number-card {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;

      min-width: 0;
      min-height: 182px;

      padding: 18px 10px;

      border: 1px solid var(--border);
      border-radius: 19px;

      background: var(--surface);
      color: var(--text);

      transition:
        transform .16s ease,
        background .16s ease,
        border-color .16s ease,
        box-shadow .16s ease;
    }

    .number-card:hover {
      transform: translateY(-4px);
      border-color: var(--selected-border);
      box-shadow: 0 10px 24px rgba(36, 53, 108, .12);
    }

    .number-card:active {
      transform: scale(.98);
    }

    .number-card.active {
      border: 2px solid var(--selected-border);
      background: var(--selected-bg);
      box-shadow: 0 0 0 2px rgba(99,102,241,.12);
    }

    /* Number icons */

    .number-icon {
      display: grid;
      place-items: center;

      width: 92px;
      height: 92px;
      flex-shrink: 0;

      overflow: hidden;
      border-radius: 18px;

      background: linear-gradient(
        135deg,
        #60a5fa,
        #2563eb
      );
    }

    .number-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .number-icon.fallback {
      color: #ffffff;
      font-size: 49px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    /* Number word */

    .number-word {
      color: var(--text);
      font-size: clamp(18px, 1.8vw, 23px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0;
    }

    /* Speaker affordance */

    .speaker-indicator {
      position: absolute;
      top: 12px;
      right: 12px;

      display: grid;
      place-items: center;

      width: 28px;
      height: 28px;

      border: 1px solid var(--border);
      border-radius: 9px;

      color: var(--muted);
      background: var(--surface);
    }

    .speaker-indicator svg {
      width: 16px;
      height: 16px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .number-card.active .speaker-indicator {
      border-color: var(--selected-border);
      color: var(--accent);
    }

    /* Status */

    .playback-status {
      min-height: 1.6em;
      margin: 24px auto 0;

      color: var(--muted);
      text-align: center;

      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
    }

    .playback-status strong {
      color: var(--accent);
      font-weight: 800;
    }

    .help-text {
      margin: 13px 0 0;

      color: var(--muted);
      text-align: center;

      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
    }

    .attribution {
      margin: 23px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    .attribution a {
      color: inherit;
    }

    /* Responsive */

    @media (max-width: 820px) {
      .numbers-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 9px;
      }

      .number-card {
        min-height: 145px;
        padding: 13px 6px;
        gap: 8px;
      }

      .number-icon {
        width: 66px;
        height: 66px;
      }

      .number-word {
        font-size: 17px;
      }

      .speaker-indicator {
        top: 6px;
        right: 6px;
        width: 23px;
        height: 23px;
      }
    }

    @media (max-width: 600px) {
      .numbers-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .number-card {
        min-height: 150px;
      }

      .number-icon {
        width: 74px;
        height: 74px;
      }

      .number-word {
        font-size: 18px;
      }

      .header {
        margin-bottom: 23px;
      }
    }

    @media (max-width: 390px) {
      .numbers-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .number-card {
        transition: none;
      }

      .number-card:hover,
      .number-card:active {
        transform: none;
      }
    }
  </style>
</head>

<body>

  <main class="slide">
    <div class="content">

      <header class="header">
        <p class="practice-label">
          PRACTICE 5
        </p>

        <h1>Numbers 1–10</h1>

        <p class="subtitle">
          Here are the English words for numbers 1–10.
          <strong>Click on a number or word to hear it spoken.</strong>
          Listen, and say the word out loud.
        </p>
      </header>

      <section
        id="numbers-grid"
        class="numbers-grid"
        aria-label="Interactive numbers one to ten"
      ></section>

      <p
        id="playback-status"
        class="playback-status"
        role="status"
        aria-live="polite"
      >
        Select a number to hear its name.
      </p>

      <p class="help-text">
        Click any number again to repeat its pronunciation.
      </p>

      <p class="attribution">
        Number icons:
        <a
          href="https://icon-sets.iconify.design/emojione-v1/"
          target="_blank"
          rel="noopener noreferrer"
        >Emoji One (v1) via Iconify</a>.
      </p>

    </div>
  </main>

  <script>
    const NUMBERS = [
      { number: 1, word: "one" },
      { number: 2, word: "two" },
      { number: 3, word: "three" },
      { number: 4, word: "four" },
      { number: 5, word: "five" },
      { number: 6, word: "six" },
      { number: 7, word: "seven" },
      { number: 8, word: "eight" },
      { number: 9, word: "nine" },
      { number: 10, word: "ten" }
    ];

    /*
      Online number icon collection.

      These are images, not CSS-generated artwork.
      The collection includes keycap numbers 1–10.

      If an external image fails to load, a readable
      digit appears instead.
    */
    function getNumberImage(number) {
      return (
        "https://api.iconify.design/emojione-v1/" +
        `keycap-${number}.svg`
      );
    }

    /*
      Optional prerecorded pronunciation.

      If you obtain accurate recordings, provide them here:

      1: "./assets/audio/one.mp3"

      Otherwise the browser's Speech Synthesis API
      will be used.
    */
    const AUDIO_FILES = {};

    const grid = document.getElementById("numbers-grid");
    const status = document.getElementById("playback-status");

    let selectedNumber = null;
    let currentAudio = null;
    let currentUtterance = null;
    let playbackId = 0;

    function getBritishVoice() {
      if (!("speechSynthesis" in window)) {
        return null;
      }

      const voices = speechSynthesis.getVoices();

      return (
        voices.find(
          voice => voice.lang.toLowerCase() === "en-gb"
        ) || null
      );
    }

    function clearActiveCards() {
      grid.querySelectorAll(".number-card").forEach(card => {
        card.classList.remove("active");
        card.setAttribute("aria-pressed", "false");
      });
    }

    function stopAudio() {
      playbackId++;

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }

      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
      }

      currentUtterance = null;
    }

    function speakNumber(item, id) {
      if (!("speechSynthesis" in window)) {
        status.textContent =
          "Speech playback is not supported in this browser.";
        clearActiveCards();
        return;
      }

      const utterance = new SpeechSynthesisUtterance(item.word);

      utterance.lang = "en-GB";
      utterance.rate = 0.82;
      utterance.pitch = 1;
      utterance.volume = 1;

      const voice = getBritishVoice();

      if (voice) {
        utterance.voice = voice;
      }

      currentUtterance = utterance;

      utterance.onend = () => {
        if (id !== playbackId) return;

        currentUtterance = null;
        clearActiveCards();
      };

      utterance.onerror = event => {
        if (id !== playbackId) return;

        currentUtterance = null;
        clearActiveCards();

        if (
          event.error !== "canceled" &&
          event.error !== "interrupted"
        ) {
          status.textContent =
            "Audio could not be played. Please try again.";
        }
      };

      speechSynthesis.speak(utterance);
    }

    async function playNumber(item, button) {
      stopAudio();

      const id = playbackId;

      selectedNumber = item.number;

      clearActiveCards();

      button.classList.add("active");
      button.setAttribute("aria-pressed", "true");

      status.textContent =
        `Number ${item.number}: ${item.word}`;

      const audioFile = AUDIO_FILES[item.number];

      if (!audioFile) {
        speakNumber(item, id);
        return;
      }

      const audio = new Audio(audioFile);
      currentAudio = audio;

      audio.onended = () => {
        if (id !== playbackId) return;

        currentAudio = null;
        clearActiveCards();
      };

      audio.onerror = () => {
        if (id !== playbackId) return;

        currentAudio = null;
        speakNumber(item, id);
      };

      try {
        await audio.play();
      } catch {
        if (id !== playbackId) return;

        currentAudio = null;
        speakNumber(item, id);
      }
    }

    const speakerSVG = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5z"></path>
        <path d="M15 9a5 5 0 0 1 0 6"></path>
        <path d="M18 6a9 9 0 0 1 0 12"></path>
      </svg>
    `;

    function createNumberCard(item) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "number-card";
      button.dataset.number = item.number;

      button.setAttribute(
        "aria-label",
        `Hear number ${item.number}, ${item.word}`
      );

      button.setAttribute("aria-pressed", "false");

      /* Number icon */

      const icon = document.createElement("span");
      icon.className = "number-icon";
      icon.setAttribute("aria-hidden", "true");

      const image = document.createElement("img");

      image.src = getNumberImage(item.number);
      image.alt = "";
      image.draggable = false;
      image.loading = "lazy";
      image.decoding = "async";

      image.addEventListener("error", () => {
        icon.replaceChildren();
        icon.classList.add("fallback");
        icon.textContent = item.number;
      });

      icon.appendChild(image);

      /* English word */

      const word = document.createElement("span");
      word.className = "number-word";
      word.textContent = item.word;

      /* Speaker indicator */

      const speaker = document.createElement("span");
      speaker.className = "speaker-indicator";
      speaker.setAttribute("aria-hidden", "true");
      speaker.innerHTML = speakerSVG;

      button.append(icon, word, speaker);

      button.addEventListener("click", () => {
        playNumber(item, button);
      });

      return button;
    }

    function renderNumbers() {
      grid.replaceChildren();

      const fragment = document.createDocumentFragment();

      NUMBERS.forEach(item => {
        fragment.appendChild(createNumberCard(item));
      });

      grid.appendChild(fragment);
    }

    /*
      Simple Reader lifecycle integration.
    */
    window.stopSlideAudio = function () {
      stopAudio();
      clearActiveCards();
    };

    window.resetSlide = function () {
      stopAudio();

      selectedNumber = null;
      clearActiveCards();

      status.textContent =
        "Select a number to hear its name.";
    };

    window.addEventListener("pagehide", () => {
      window.stopSlideAudio();
    });

    renderNumbers();
  </script>

</body>
</html>
