
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Let's Learn the Numbers | Boston English Center</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script>
    let initialTheme;

    try {
      if (window.parent !== window) {
        initialTheme =
          window.parent.document.documentElement.classList.contains("dark")
            ? "dark" : "light";
      }
    } catch {}

    if (!initialTheme) {
      try {
        initialTheme = localStorage.getItem("editor-theme-preference");
      } catch {}
    }

    if (!initialTheme) {
      initialTheme = matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light";
    }

    document.documentElement.classList.toggle(
      "dark", initialTheme === "dark"
    );

    window.setTheme = function (theme) {
      document.documentElement.classList.toggle(
        "dark", theme === "dark"
      );
    };
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    :root {
      color-scheme: light;
      --page: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #0f172a;
      --muted: #475569;
      --border: #d9e0ed;
      --track: #d9e0ed;
      --accent: #4f46e5;
      --heading-start: #384fc7;
      --heading-end: #2769cd;
    }

    :root.dark {
      color-scheme: dark;
      --page: #0f172a;
      --surface: #10192d;
      --surface-alt: #1e293b;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: #34405f;
      --track: #34405f;
      --accent: #818cf8;
      --heading-start: #6861f4;
      --heading-end: #3c79f4;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--page);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible,
    .video-panel:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    /* Slide layout */

    .slide {
      display: grid;
      place-items: center;
      min-height: 100dvh;

      padding:
        clamp(25px, 4vh, 48px)
        clamp(16px, 4vw, 55px);

      background:
        radial-gradient(
          circle at 5% 5%,
          rgba(79,70,229,.08),
          transparent 34%
        ),
        var(--page);
    }

    .dark .slide {
      background:
        radial-gradient(
          circle at 5% 5%,
          rgba(99,102,241,.17),
          transparent 34%
        ),
        var(--page);
    }

    .content {
      width: 100%;
      max-width: 960px;
      min-width: 0;
      margin: 0 auto;
    }

    /* Header */

    .slide-header {
      margin: 0 0 clamp(25px, 4vh, 42px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .13em;
    }

    h1 {
      margin: 0 auto;
      max-width: 900px;

      background: linear-gradient(
        100deg,
        var(--heading-start),
        var(--heading-end)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      font-size: clamp(36px, 5.2vw, 68px);
      font-weight: 800;
      line-height: 1.13;
      letter-spacing: -.04em;
      text-wrap: balance;
    }

    /* Video container */

    .video-panel {
      width: 100%;
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 20px;

      background: var(--surface);

      box-shadow: 0 14px 40px rgba(4,11,30,.10);
    }

    .video-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #080d1c;
    }

    .video-stage video {
      position: absolute;
      inset: 0;
      display: block;

      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #080d1c;
    }

    /* Cover shown before the first frame loads */

    .video-cover {
      position: absolute;
      inset: 0;
      z-index: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(99,102,241,.28),
          transparent 50%
        ),
        linear-gradient(135deg, #101a35, #080d1c);

      color: #ffffff;
      text-align: center;
    }

    .cover-number {
      font-size: clamp(65px, 13vw, 140px);
      font-weight: 800;
      letter-spacing: -.07em;
      line-height: 1.1;

      background: linear-gradient(
        135deg, #7bb8ff, #8c5cf6
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .cover-label {
      color: #cbd5e1;
      font-size: clamp(13px, 2vw, 18px);
      font-weight: 700;
      letter-spacing: .06em;
    }

    /* Center play button */

    .center-play {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      display: grid;
      place-items: center;

      width: 76px;
      height: 76px;
      padding: 0;

      border: 1px solid rgba(255,255,255,.4);
      border-radius: 50%;

      background: linear-gradient(
        135deg, #506df0, #7136d4
      );
      color: #ffffff;

      box-shadow: 0 12px 35px rgba(0,0,0,.32);

      transition: filter .15s ease;
    }

    .center-play:hover:not(:disabled) {
      filter: brightness(1.15);
    }

    .center-play svg {
      width: 34px;
      height: 34px;
      fill: currentColor;
    }

    /* Error state */

    .video-error {
      position: absolute;
      inset: 0;
      z-index: 4;

      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;

      padding: 25px;
      background: #080d1c;
      color: #f8fafc;
      text-align: center;
    }

    .video-error strong {
      font-size: 18px;
      font-weight: 800;
    }

    .video-error p {
      margin: 0;
      max-width: 360px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Controls */

    .player-controls {
      padding: 16px 19px;
      background: var(--surface);
    }

    .seek-slider {
      --progress: 0%;

      display: block;
      width: 100%;
      height: 6px;
      margin: 0 0 18px;

      appearance: none;
      border: 0;
      border-radius: 12px;

      background: linear-gradient(
        to right,
        #6265f4 0%,
        #6265f4 var(--progress),
        var(--track) var(--progress),
        var(--track) 100%
      );

      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #6265f4;
      box-shadow: 0 1px 5px rgba(0,0,0,.2);
    }

    .seek-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #6265f4;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .play-button {
      display: grid;
      place-items: center;

      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      padding: 0;

      border: 0;
      border-radius: 13px;

      background: linear-gradient(
        135deg, #4b71ef, #7136d4
      );
      color: #fff;
    }

    .play-button:hover:not(:disabled) {
      filter: brightness(1.1);
    }

    .play-button svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
    }

    .time-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .controls-spacer {
      flex: 1;
      min-width: 0;
    }

    .icon-button {
      display: grid;
      place-items: center;

      flex: 0 0 37px;
      width: 37px;
      height: 37px;
      padding: 0;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: var(--surface-alt);
      color: var(--text);
    }

    .icon-button:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .icon-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .volume-slider {
      width: 80px;
      min-width: 0;
      accent-color: #6265f4;
      cursor: pointer;
    }

    .video-caption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      padding: 0 19px 16px;
      background: var(--surface);

      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .video-caption strong {
      color: var(--text);
      font-weight: 700;
    }

    .player-status {
      min-height: 1.5em;
      margin: 13px 0 0;

      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
    }

    /* Fullscreen */

    .video-panel:fullscreen {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      border: 0;
      border-radius: 0;
      background: #080d1c;
    }

    .video-panel:fullscreen .video-stage {
      flex: 1;
      min-height: 0;
      aspect-ratio: auto;
    }

    .video-panel:fullscreen .player-controls,
    .video-panel:fullscreen .video-caption {
      flex-shrink: 0;
    }

    /* Responsive */

    @media (max-width: 600px) {
      .slide {
        padding: 22px 12px 32px;
      }

      .slide-header {
        margin-bottom: 22px;
      }

      h1 {
        font-size: clamp(31px, 8vw, 45px);
      }

      .video-panel {
        border-radius: 15px;
      }

      .player-controls {
        padding: 13px;
      }

      .control-row {
        gap: 8px;
      }

      .volume-slider {
        width: 45px;
      }

      .center-play {
        width: 62px;
        height: 62px;
      }

      .center-play svg {
        width: 28px;
        height: 28px;
      }

      .time-label {
        font-size: 11px;
      }

      .video-caption {
        padding: 0 13px 13px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .center-play {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="slide">
    <div class="content">

      <header class="slide-header">
        <p class="eyebrow">NUMBERS 1–20</p>

        <h1>Let's Learn the Numbers</h1>
      </header>

      <section
        class="video-panel"
        id="video-panel"
        tabindex="0"
        aria-label="Numbers lesson video player"
      >

        <div class="video-stage" id="video-stage">

          <video
            id="numbers-video"
            preload="metadata"
            playsinline
            aria-label="English numbers 1 to 20 learning video"
          >
            <source
              src="./assets/numbers-1-20-elevenlabs-voice.mp4"
              type="video/mp4"
            >
            Your browser does not support HTML5 video.
          </video>

          <div class="video-cover" id="video-cover">
            <span class="cover-number">1–20</span>
            <span class="cover-label">LET'S LEARN NUMBERS</span>
          </div>

          <button
            id="center-play"
            class="center-play"
            type="button"
            aria-label="Play numbers video"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z"></path>
            </svg>
          </button>

          <div
            class="video-error"
            id="video-error"
            role="alert"
            hidden
          >
            <strong>Video unavailable</strong>
            <p>
              Make sure your numbers video is located at
              chapter-1/slide-8/assets/numbers.mp4.
            </p>
          </div>

        </div>

        <div class="player-controls">

          <input
            id="seek"
            class="seek-slider"
            type="range"
            min="0"
            max="1000"
            value="0"
            disabled
            aria-label="Video playback position"
          >

          <div class="control-row">

            <button
              id="play-pause"
              class="play-button"
              type="button"
              aria-label="Play video"
              disabled
            >
              <svg
                id="play-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M8 5v14l11-7z"></path>
              </svg>

              <svg
                id="pause-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                hidden
              >
                <rect x="6" y="5" width="4" height="14"></rect>
                <rect x="14" y="5" width="4" height="14"></rect>
              </svg>
            </button>

            <span id="video-time" class="time-label">
              0:00 / 0:00
            </span>

            <span class="controls-spacer"></span>

            <button
              id="mute"
              class="icon-button"
              type="button"
              aria-label="Mute video"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4V5z"></path>
                <path
                  id="sound-waves"
                  d="M15 9a5 5 0 0 1 0 6
                     M18 6a9 9 0 0 1 0 12"
                ></path>
              </svg>
            </button>

            <input
              id="volume"
              class="volume-slider"
              type="range"
              min="0"
              max="100"
              value="80"
              disabled
              aria-label="Video volume"
            >

            <button
              id="fullscreen"
              class="icon-button"
              type="button"
              aria-label="Enter video fullscreen"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H3v5"></path>
                <path d="M16 3h5v5"></path>
                <path d="M3 16v5h5"></path>
                <path d="M21 16v5h-5"></path>
              </svg>
            </button>

          </div>
        </div>

        <div class="video-caption">
          <strong>English Numbers 1–20</strong>
          <span>Listening Practice</span>
        </div>

      </section>

      <p
        id="player-status"
        class="player-status"
        role="status"
        aria-live="polite"
      >
        Loading numbers video...
      </p>

    </div>
  </main>

  <script>
    const video = document.getElementById("numbers-video");
    const panel = document.getElementById("video-panel");
    const stage = document.getElementById("video-stage");
    const cover = document.getElementById("video-cover");
    const centerPlay = document.getElementById("center-play");
    const videoError = document.getElementById("video-error");

    const playButton = document.getElementById("play-pause");
    const playIcon = document.getElementById("play-icon");
    const pauseIcon = document.getElementById("pause-icon");

    const seek = document.getElementById("seek");
    const videoTime = document.getElementById("video-time");
    const muteButton = document.getElementById("mute");
    const soundWaves = document.getElementById("sound-waves");
    const volumeSlider = document.getElementById("volume");
    const fullscreenButton = document.getElementById("fullscreen");
    const status = document.getElementById("player-status");

    let ready = false;
    let scrubbing = false;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
      }

      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const remaining = total % 60;

      if (hours > 0) {
        return (
          `${hours}:${String(minutes).padStart(2, "0")}:` +
          String(remaining).padStart(2, "0")
        );
      }

      return `${minutes}:${String(remaining).padStart(2, "0")}`;
    }

    function duration() {
      return Number.isFinite(video.duration)
        ? video.duration
        : 0;
    }

    function updatePlaybackUI() {
      const playing = !video.paused && !video.ended;

      playIcon.toggleAttribute("hidden", playing);
      pauseIcon.toggleAttribute("hidden", !playing);

      centerPlay.hidden = playing || !videoError.hidden;

      playButton.setAttribute(
        "aria-label",
        playing ? "Pause video" : "Play video"
      );

      centerPlay.setAttribute(
        "aria-label",
        video.ended ? "Replay numbers video" : "Play numbers video"
      );
    }

    function updateTimeline() {
      const total = duration();
      const current = video.currentTime || 0;

      if (!scrubbing) {
        const progress =
          total > 0
            ? Math.min(100, current / total * 100)
            : 0;

        seek.value = Math.round(progress * 10);

        seek.style.setProperty(
          "--progress",
          `${progress}%`
        );
      }

      const shown =
        scrubbing && total > 0
          ? Number(seek.value) / 1000 * total
          : current;

      videoTime.textContent =
        `${formatTime(shown)} / ${formatTime(total)}`;
    }

    function updateVolume() {
      const silent = video.muted || video.volume === 0;

      muteButton.setAttribute(
        "aria-label",
        silent ? "Unmute video" : "Mute video"
      );

      soundWaves.style.display = silent ? "none" : "";

      volumeSlider.value =
        video.muted ? 0 : Math.round(video.volume * 100);
    }

    function enablePlayer() {
      ready = true;

      playButton.disabled = false;
      centerPlay.disabled = false;
      muteButton.disabled = false;
      volumeSlider.disabled = false;
      seek.disabled = duration() <= 0;

      videoError.hidden = true;

      updateTimeline();
      updateVolume();
      updatePlaybackUI();

      status.textContent = "";
    }

    function showError() {
      ready = false;
      videoError.hidden = false;
      centerPlay.hidden = true;

      playButton.disabled = true;
      centerPlay.disabled = true;
      muteButton.disabled = true;
      volumeSlider.disabled = true;
      seek.disabled = true;

      status.textContent =
        "The video file could not be loaded.";
    }

    async function togglePlayback() {
      if (!ready) return;

      try {
        if (video.paused || video.ended) {
          if (video.ended) {
            video.currentTime = 0;
          }

          await video.play();
        } else {
          video.pause();
        }
      } catch (error) {
        status.textContent =
          "Playback could not start. Please try again.";

        console.warn("Video playback failed:", error);
      }
    }

    /* Video events */

    video.addEventListener("loadedmetadata", enablePlayer);

    video.addEventListener("loadeddata", () => {
      cover.hidden = true;
    });

    video.addEventListener("durationchange", () => {
      seek.disabled = !ready || duration() <= 0;
      updateTimeline();
    });

    video.addEventListener("timeupdate", updateTimeline);

    video.addEventListener("play", () => {
      cover.hidden = true;
      updatePlaybackUI();
      status.textContent = "";
    });

    video.addEventListener("pause", updatePlaybackUI);

    video.addEventListener("ended", () => {
      updatePlaybackUI();
      status.textContent =
        "Video finished. You can replay it.";
    });

    video.addEventListener("volumechange", updateVolume);

    video.addEventListener("error", showError);

    video.addEventListener("waiting", () => {
      if (!video.paused) {
        status.textContent = "Loading video...";
      }
    });

    video.addEventListener("playing", () => {
      status.textContent = "";
    });

    /* Playback controls */

    playButton.addEventListener("click", togglePlayback);
    centerPlay.addEventListener("click", togglePlayback);

    stage.addEventListener("click", event => {
      if (event.target === video || event.target === cover) {
        togglePlayback();
      }
    });

    /* Seeking */

    seek.addEventListener("input", () => {
      scrubbing = true;

      const percent = Number(seek.value) / 10;

      seek.style.setProperty(
        "--progress",
        `${percent}%`
      );

      updateTimeline();
    });

    seek.addEventListener("change", () => {
      if (duration() > 0) {
        video.currentTime =
          Number(seek.value) / 1000 * duration();
      }

      scrubbing = false;
      updateTimeline();
    });

    seek.addEventListener("pointercancel", () => {
      scrubbing = false;
      updateTimeline();
    });

    /* Volume */

    volumeSlider.addEventListener("input", () => {
      video.muted = false;
      video.volume = Number(volumeSlider.value) / 100;
      updateVolume();
    });

    muteButton.addEventListener("click", () => {
      if (video.muted || video.volume === 0) {
        video.muted = false;

        if (video.volume === 0) {
          video.volume = 0.8;
        }
      } else {
        video.muted = true;
      }

      updateVolume();
    });

    /* Fullscreen */

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement === panel) {
          await document.exitFullscreen();
        } else if (panel.requestFullscreen) {
          await panel.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        } else {
          throw new Error("Fullscreen not supported");
        }
      } catch (error) {
        status.textContent =
          "Fullscreen is not available in this reader.";

        console.warn("Fullscreen failed:", error);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.setAttribute(
        "aria-label",
        document.fullscreenElement === panel
          ? "Exit video fullscreen"
          : "Enter video fullscreen"
      );
    });

    /* Keyboard shortcuts when the player is focused */

    panel.addEventListener("keydown", event => {
      if (
        event.target !== panel ||
        !ready
      ) {
        return;
      }

      if (event.code === "Space" || event.code === "KeyK") {
        event.preventDefault();
        togglePlayback();
      }

      if (event.code === "KeyM") {
        event.preventDefault();
        muteButton.click();
      }
    });

    /* Simple Reader lifecycle */

    window.stopSlideAudio = function () {
      video.pause();
    };

    window.resetSlide = function () {
      video.pause();

      if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
        video.currentTime = 0;
      }

      scrubbing = false;

      updatePlaybackUI();
      updateTimeline();

      status.textContent = "";
    };

    window.addEventListener("pagehide", () => {
      video.pause();
    });

    /* Initial settings */

    video.volume = 0.8;

    if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
      enablePlayer();
    } else if (video.error) {
      showError();
    }
  </script>
