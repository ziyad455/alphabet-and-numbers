
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Lesson Complete | Boston English Center</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    let initialTheme;

    try {
      if (window.parent !== window) {
        initialTheme =
          window.parent.document.documentElement.classList
            .contains("dark") ? "dark" : "light";
      }
    } catch {}

    if (!initialTheme) {
      try {
        initialTheme = localStorage.getItem(
          "editor-theme-preference"
        );
      } catch {}
    }

    if (!initialTheme) {
      initialTheme = matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches ? "dark" : "light";
    }

    document.documentElement.classList.toggle(
      "dark", initialTheme === "dark"
    );

    window.setTheme = function(theme) {
      document.documentElement.classList.toggle(
        "dark", theme === "dark"
      );
    };

    window.stopSlideAudio = function() {};
    window.resetSlide = function() {};
  </script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;

      --page: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #d9e0ed;

      --heading-start: #384fc7;
      --heading-end: #2769cd;
      --accent: #4f46e5;

      --chip-bg: #eef2ff;
      --chip-text: #384fc7;
    }

    :root.dark {
      color-scheme: dark;

      --page: #0f172a;
      --surface: #111b30;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: #34405f;

      --heading-start: #6861f4;
      --heading-end: #3c79f4;
      --accent: #a5b4fc;

      --chip-bg: #252e50;
      --chip-text: #c7d2fe;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--page);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 4px;
    }

    /* Slide */

    .slide {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100dvh;

      padding:
        clamp(22px, 3vh, 40px)
        clamp(16px, 4vw, 52px);

      overflow: hidden;

      background:
        radial-gradient(
          circle at 12% 15%,
          rgba(99,102,241,.12),
          transparent 32%
        ),
        radial-gradient(
          circle at 88% 85%,
          rgba(14,165,233,.08),
          transparent 30%
        ),
        var(--page);
    }

    .dark .slide {
      background:
        radial-gradient(
          circle at 12% 15%,
          rgba(99,102,241,.2),
          transparent 32%
        ),
        radial-gradient(
          circle at 88% 85%,
          rgba(14,165,233,.12),
          transparent 30%
        ),
        var(--page);
    }

    .content {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 1000px;

      margin: auto;
      text-align: center;

      animation: enter .65s ease-out both;
    }

    /* Header */

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      margin: 0 0 13px;
      padding: 9px 18px;

      border: 1px solid var(--border);
      border-radius: 30px;

      background: var(--surface);
      color: var(--accent);

      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    h1 {
      margin: 0;

      background: linear-gradient(
        100deg,
        var(--heading-start),
        var(--heading-end)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      font-size: clamp(46px, 7vw, 82px);
      font-weight: 800;
      letter-spacing: -.055em;
      line-height: 1.12;
    }

    .subtitle {
      margin: 12px auto 0;

      color: var(--text);
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 700;
      line-height: 1.5;
    }

    /* Celebration illustration */

    .illustration-wrap {
      position: relative;

      width: fit-content;
      max-width: 100%;

      margin:
        clamp(19px, 3vh, 30px)
        auto
        clamp(17px, 2.5vh, 27px);

      padding: 7px;

      border: 1px solid var(--border);
      border-radius: 24px;

      background: #ffffff;

      box-shadow:
        0 15px 45px rgba(36,53,108,.1);
    }

    .celebration-image {
      display: block;

      width: auto;
      max-width: 100%;
      max-height: min(45dvh, 435px);

      height: auto;
      object-fit: contain;

      border-radius: 17px;
    }

    /* Message */

    .message {
      max-width: 700px;
      margin: 0 auto;

      color: var(--muted);
      font-size: clamp(15px, 1.5vw, 18px);
      font-weight: 500;
      line-height: 1.7;
    }

    /* Learning recap */

    .achievements {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      gap: 10px;
      margin: 19px auto 0;
    }

    .achievement {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 10px 14px;

      border-radius: 30px;

      background: var(--chip-bg);
      color: var(--chip-text);

      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }

    .achievement svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;

      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* CTA */

    .action-wrap {
      margin-top: clamp(21px, 3vh, 32px);
    }

    .restart-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;

      min-width: min(100%, 320px);
      min-height: 62px;

      padding: 14px 28px;

      border: 1px solid #7c6dff;
      border-radius: 15px;

      background: linear-gradient(
        110deg,
        #496ef0,
        #7136d4
      );

      color: #ffffff;

      box-shadow:
        0 10px 24px rgba(79,70,229,.2);

      font-size: 18px;
      font-weight: 800;

      transition:
        filter .16s ease,
        transform .16s ease,
        box-shadow .16s ease;
    }

    .restart-button:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);

      box-shadow:
        0 14px 30px rgba(79,70,229,.25);
    }

    .restart-button:active {
      transform: scale(.98);
    }

    .restart-icon {
      display: grid;
      place-items: center;

      width: 33px;
      height: 33px;

      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50%;

      background: rgba(255,255,255,.14);
    }

    .restart-icon svg {
      width: 19px;
      height: 19px;

      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .closing-note {
      margin: 14px 0 0;

      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .status {
      min-height: 1.3em;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    /* Entrance animation */

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(17px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */

    @media (max-width: 650px) {
      .slide {
        padding: 25px 15px 35px;
      }

      .celebration-image {
        max-height: 38dvh;
      }

      .illustration-wrap {
        padding: 5px;
        border-radius: 17px;
      }

      .restart-button {
        min-height: 56px;
        font-size: 16px;
      }

      .achievements {
        gap: 7px;
      }

      .achievement {
        padding: 8px 11px;
        font-size: 11px;
      }
    }

    @media (max-height: 720px) {
      .celebration-image {
        max-height: 34dvh;
      }

      .content h1 {
        font-size: clamp(38px, 5vw, 60px);
      }

      .illustration-wrap {
        margin-block: 14px;
      }

      .action-wrap {
        margin-top: 15px;
      }

      .achievements {
        margin-top: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content {
        animation: none;
      }

      .restart-button {
        transition: none;
      }

      .restart-button:hover,
      .restart-button:active {
        transform: none;
      }
    }
  </style>
</head>

<body>

  <main class="slide">
    <div class="content">

      <!-- Completion header -->

      <header>
        <p class="eyebrow">
          UNIT 1 · LESSON COMPLETE
        </p>

        <h1>You Did It!</h1>

        <p class="subtitle">
          Great Job! You've completed ABC and 123.
        </p>
      </header>

      <!-- Generated illustration -->

      <div class="illustration-wrap">
        <img
          class="celebration-image"
          src="./assets/abc_and_123_lesson_celebration.png"
          alt="Happy colorful letters A, B and C and numbers 1 to 5 celebrating the completion of the ABC and 123 lesson"
          width="1448"
          height="1086"
        >
      </div>

      <!-- Congratulations -->

      <p class="message">
        You've learned so much!
        Keep practicing your letters, numbers, and spelling.
        Every little step makes you better at English.
      </p>

      <!-- Learning achievements -->

      <div class="achievements" aria-label="Lesson topics completed">

        <span class="achievement">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 12 4 4L19 6"></path>
          </svg>
          English Alphabet
        </span>

        <span class="achievement">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 12 4 4L19 6"></path>
          </svg>
          Numbers 1–20
        </span>

        <span class="achievement">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 12 4 4L19 6"></path>
          </svg>
          Writing &amp; Spelling
        </span>

      </div>

      <!-- Start again -->

      <div class="action-wrap">

        <button
          class="restart-button"
          id="restart-button"
          type="button"
        >
          <span>Start Again</span>

          <span class="restart-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 11a9 9 0 1 1 2.6 6.4"></path>
              <path d="M3 4v7h7"></path>
            </svg>
          </span>
        </button>

      </div>

      <p class="closing-note">
        Keep learning. Keep growing.
      </p>

      <p
        class="status"
        id="restart-status"
        role="status"
        aria-live="polite"
      ></p>

    </div>
  </main>

  <script>
    const restartButton =
      document.getElementById("restart-button");

    const restartStatus =
      document.getElementById("restart-status");

    /*
      Start Again

      Navigate to Slide 1 through the parent reader.

      Reader slide indices are zero-based:
        Slide 1 = index 0
        Slide 18 = index 17

      Do not replace the reader's URL when embedded.
    */

    restartButton.addEventListener("click", () => {
      try {
        if (
          window.parent !== window &&
          typeof window.parent.goToSlide === "function"
        ) {
          window.parent.goToSlide(0);
          return;
        }
      } catch (error) {
        console.warn("Reader navigation unavailable:", error);
      }

      /*
        Standalone preview fallback.

        If opened outside the reader,
        navigate to the first slide directly.
      */

      if (window.parent === window) {
        window.location.href = "../slide-1/index.html";
        return;
      }

      restartStatus.textContent =
        "Use the slide navigation to return to Slide 1.";
    });
  </script>

</body>
</html>
