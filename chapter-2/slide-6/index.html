<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet Ahmed and Sara | Boston English Center</title>
  <link rel="stylesheet" href="../shared/dialogue-base.css">
  <style>
    .slide-heading { margin-bottom: 22px; }
    .control-strip {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 14px; margin-bottom: 18px;
    }
    .mode-switch {
      display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line);
      border-radius: 14px; background: var(--surface);
    }
    .mode-switch button {
      border: 0; border-radius: 10px; min-width: 112px; min-height: 42px;
      padding: 8px 14px; background: transparent; color: var(--muted);
      font-size: 14px; font-weight: 800;
    }
    .mode-switch button[aria-selected='true'] { color: white; background: var(--blue); }
    .strip-end { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .progress-label { color: var(--muted); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .scene {
      display: grid; grid-template-columns: minmax(150px, 205px) minmax(0, 1fr) minmax(150px, 205px);
      align-items: start; gap: clamp(14px, 2vw, 28px);
    }
    .person {
      position: sticky; top: 18px; min-width: 0; text-align: center;
      padding: 12px; border-radius: 22px; border: 1px solid var(--line);
      background: var(--surface); transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .person[data-active='true'] { transform: translateY(-3px); border-color: var(--blue); box-shadow: 0 0 0 3px rgba(82, 107, 246, .16); }
    .person.sara[data-active='true'] { border-color: var(--sara); box-shadow: 0 0 0 3px rgba(183, 154, 247, .17); }
    .portrait {
      aspect-ratio: 4 / 4.5; width: 100%; overflow: hidden; border-radius: 15px;
      font-size: 56px; border: 1px solid var(--line);
    }
    .person h2 { margin: 10px 0 2px; font-size: clamp(18px, 1.8vw, 23px); letter-spacing: -.03em; }
    .person p { margin: 0 0 3px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .conversation {
      min-width: 0; border: 1px solid var(--line); border-radius: 22px;
      background: var(--surface); overflow: hidden;
    }
    .conversation-top {
      padding: 16px 18px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    }
    .conversation-top h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .conversation-top p { margin: 3px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .playback-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .playback-controls button { min-height: 41px; }
    .dialogue-list {
      max-height: min(55vh, 630px); overflow-y: auto; overscroll-behavior: contain;
      padding: 16px 18px 20px; scrollbar-color: var(--line) transparent;
    }
    .line-row { display: flex; margin-bottom: 10px; }
    .line-row:last-child { margin-bottom: 0; }
    .line-row.sara { justify-content: flex-end; }
    .bubble {
      display: flex; align-items: center; gap: 13px; width: min(92%, 580px);
      min-height: 58px; padding: 10px 14px; border-radius: 16px;
      border: 1px solid var(--line); background: var(--surface-raised);
      color: var(--text); text-align: left;
      transition: border-color .2s, background-color .2s, opacity .2s, transform .2s;
    }
    .line-row.sara .bubble { background: color-mix(in srgb, var(--surface-raised) 85%, var(--purple)); }
    .bubble:hover { border-color: var(--blue); transform: translateY(-1px); }
    .bubble[data-active='true'] { border-color: var(--blue); box-shadow: inset 4px 0 var(--blue); }
    .line-row.sara .bubble[data-active='true'] { border-color: var(--sara); box-shadow: inset -4px 0 var(--sara); }
    .dialogue-list[data-speaking='true'] .bubble:not([data-active='true']) { opacity: .72; }
    .line-number { min-width: 26px; color: var(--soft); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .line-body { flex: 1; min-width: 0; }
    .line-speaker { display: block; margin-bottom: 2px; color: var(--soft); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .line-text { display: block; font-size: clamp(16px, 1.4vw, 20px); font-weight: 700; line-height: 1.38; letter-spacing: -.025em; }
    .speaker-mark {
      display: grid; place-items: center; flex: none; width: 36px; height: 36px;
      border: 1px solid var(--line); border-radius: 50%; color: var(--text); background: var(--surface);
    }
    .bubble:hover .speaker-mark, .bubble[data-active='true'] .speaker-mark { border-color: currentColor; }
    .practice-bar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      padding: 14px 18px; border-top: 1px solid var(--line);
    }
    .practice-bar p { margin: 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    .practice-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .practice-buttons button { min-height: 40px; }
    .audio-status { min-height: 22px; margin: 10px 0 0; color: var(--muted); text-align: center; font-size: 13px; font-weight: 700; }
    @media (max-width: 960px) {
      .scene { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .person { position: static; display: flex; align-items: center; gap: 11px; text-align: left; padding: 8px; border-radius: 15px; }
      .person.sara { grid-column: 2; grid-row: 1; }
      .person .portrait { width: 66px; height: 66px; flex: none; border-radius: 10px; font-size: 30px; }
      .person h2 { margin: 0 0 2px; }
      .conversation { grid-column: 1 / -1; }
      .dialogue-list { max-height: min(53vh, 560px); }
    }
    @media (max-width: 600px) {
      .slide-shell { padding: 18px 14px 28px; }
      .slide-heading { margin-bottom: 18px; }
      .slide-heading h1 { font-size: clamp(32px, 8vw, 43px); }
      .control-strip { align-items: flex-start; }
      .mode-switch { width: 100%; }
      .mode-switch button { flex: 1; }
      .strip-end { width: 100%; justify-content: space-between; }
      .scene { gap: 9px; }
      .person .portrait { width: 50px; height: 56px; }
      .person h2 { font-size: 16px; }
      .person p { display: none; }
      .conversation-top { padding: 13px; }
      .conversation-top h2 { font-size: 15px; }
      .dialogue-list { padding: 12px; max-height: min(53vh, 480px); }
      .bubble { width: 96%; min-height: 60px; gap: 8px; padding: 9px 10px; }
      .line-text { font-size: 16px; }
      .line-number { min-width: 22px; }
      .speaker-mark { width: 32px; height: 32px; }
      .practice-bar { padding: 12px; }
      .practice-buttons { width: 100%; }
      .practice-buttons button { flex: 1; padding: 8px; }
    }
  </style>
</head>
<body>
  <main class="slide-shell">
    <div class="slide-inner">
      <header class="slide-heading">
        <h1>Meet Ahmed and Sara</h1>
        <p>Listen to their conversation and learn how to introduce yourself in English.</p>
      </header>

      <div class="control-strip">
        <div class="mode-switch" role="tablist" aria-label="Listening mode">
          <button id="listen-tab" type="button" role="tab" aria-selected="true" aria-controls="conversation" tabindex="0">Listen</button>
          <button id="practice-tab" type="button" role="tab" aria-selected="false" aria-controls="conversation" tabindex="-1">Practice</button>
        </div>
        <div class="strip-end">
          <span class="progress-label" id="progress">12 lines · Ready to listen</span>
          <button class="secondary-button" id="toggle-text" type="button" aria-pressed="false">Hide dialogue</button>
        </div>
      </div>

      <section class="scene" aria-label="Conversation between Ahmed and Sara">
        <aside class="person ahmed" id="ahmed-person" data-active="false" aria-label="Ahmed">
          <div class="portrait photo-fallback"><span aria-hidden="true">A</span><img src="https://images.pexels.com/photos/6481907/pexels-photo-6481907.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=800" alt="Portrait representing Ahmed in a blue shirt" loading="eager" onerror="this.hidden=true"></div>
          <div><h2>Ahmed</h2><p>Listen for his voice</p></div>
        </aside>

        <div class="conversation" id="conversation" role="tabpanel" aria-labelledby="listen-tab">
          <div class="conversation-top">
            <div><h2 id="conversation-title">The conversation</h2><p id="mode-help">Play the full exchange or choose any line.</p></div>
            <div class="playback-controls" id="full-controls">
              <button class="primary-button" id="play-full" type="button">Play Full Conversation</button>
              <button class="secondary-button" id="stop" type="button" disabled>Stop</button>
            </div>
          </div>
          <div class="dialogue-list" id="dialogue-list" role="list" aria-label="Ahmed and Sara's dialogue" data-speaking="false"></div>
          <div class="practice-bar" id="practice-bar" hidden>
            <p id="practice-instruction">Listen to line 1. Then say it aloud.</p>
            <div class="practice-buttons">
              <button class="secondary-button" id="previous-line" type="button" disabled>Previous</button>
              <button class="primary-button" id="hear-line" type="button">Hear line</button>
              <button class="secondary-button" id="next-line" type="button">Next line</button>
            </div>
          </div>
        </div>

        <aside class="person sara" id="sara-person" data-active="false" aria-label="Sara">
          <div class="portrait photo-fallback"><span aria-hidden="true">S</span><img src="https://images.pexels.com/photos/4728683/pexels-photo-4728683.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=800" alt="Portrait representing Sara wearing a headscarf" loading="eager" onerror="this.hidden=true"></div>
          <div><h2>Sara</h2><p>Listen for her voice</p></div>
        </aside>
      </section>
      <p class="audio-status" id="audio-status" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script src="../shared/dialogue-data.js"></script>
  <script src="../shared/dialogue-audio.js"></script>
  <script>
    (() => {
      const lines = window.BEC_DIALOGUE.lines;
      const $ = id => document.getElementById(id);
      const list = $('dialogue-list');
      const progress = $('progress');
      const status = $('audio-status');
      const fullButton = $('play-full');
      const stopButton = $('stop');
      const practiceBar = $('practice-bar');
      const modeHelp = $('mode-help');
      const audio = window.createDialogueAudio('./assets/audio/', onAudioState);
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const speakerSvg = '<svg class="speaker-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"></path></svg>';
      let mode = 'listen';
      let hiddenText = false;
      let activeIndex = -1;
      let practiceIndex = 0;
      let fullState = 'idle';
      let sequenceToken = 0;
      let nextTimer = 0;
      let pendingNext = -1;

      lines.forEach((line, index) => {
        const row = document.createElement('div');
        row.className = `line-row ${line.speaker}`;
        row.setAttribute('role', 'listitem');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'bubble';
        button.dataset.active = 'false';
        button.setAttribute('aria-label', `Play ${line.speaker === 'ahmed' ? 'Ahmed' : 'Sara'}'s line ${index + 1}`);
        button.innerHTML = `<span class="line-number">${String(index + 1).padStart(2, '0')}</span><span class="line-body"><span class="line-speaker">${line.speaker}</span><span class="line-text"></span></span><span class="speaker-mark">${speakerSvg}</span>`;
        button.querySelector('.line-text').textContent = line.text;
        button.addEventListener('click', () => playSingle(index));
        row.appendChild(button);
        list.appendChild(row);
      });

      function setActive(index, speaking = false) {
        activeIndex = index;
        list.dataset.speaking = String(speaking);
        list.querySelectorAll('.bubble').forEach((bubble, i) => {
          bubble.dataset.active = String(i === index);
          bubble.setAttribute('aria-current', i === index ? 'true' : 'false');
        });
        $('ahmed-person').dataset.active = String(speaking && lines[index]?.speaker === 'ahmed');
        $('sara-person').dataset.active = String(speaking && lines[index]?.speaker === 'sara');
        if (index >= 0) {
          progress.textContent = `Line ${index + 1} of ${lines.length}`;
          list.querySelectorAll('.bubble')[index].scrollIntoView({ block: 'nearest', behavior: reducedMotion.matches ? 'auto' : 'smooth' });
        } else {
          progress.textContent = `${lines.length} lines · Ready to listen`;
        }
      }

      function onAudioState(state, index) {
        if (state === 'playing') {
          setActive(index, true);
          status.textContent = `${lines[index].speaker === 'ahmed' ? 'Ahmed' : 'Sara'} is speaking.`;
        } else if (state === 'paused') {
          setActive(index, false);
          status.textContent = 'Paused.';
        } else if (state === 'ended') {
          setActive(index, false);
          status.textContent = mode === 'practice' ? 'Your turn. Say the line aloud, or hear it again.' : '';
        } else if (state === 'error') {
          stopSequence();
          status.textContent = 'This audio could not play. Please try again.';
        }
      }

      function stopSequence() {
        sequenceToken++;
        clearTimeout(nextTimer);
        nextTimer = 0;
        pendingNext = -1;
        fullState = 'idle';
        audio.stop();
        setActive(-1);
        updateControls();
      }

      function updateControls() {
        fullButton.textContent = fullState === 'playing' || fullState === 'between' ? 'Pause Conversation'
          : fullState === 'paused' ? 'Resume Conversation'
          : fullState === 'finished' ? 'Replay Conversation' : 'Play Full Conversation';
        stopButton.disabled = fullState === 'idle' || fullState === 'finished';
      }

      function playSequenceLine(index, token) {
        if (token !== sequenceToken) return;
        if (index >= lines.length) {
          fullState = 'finished';
          status.textContent = 'Conversation finished. You can replay any line.';
          updateControls();
          return;
        }
        pendingNext = -1;
        fullState = 'playing';
        updateControls();
        audio.play(index, () => {
          if (token !== sequenceToken || mode !== 'listen') return;
          pendingNext = index + 1;
          fullState = 'between';
          updateControls();
          nextTimer = setTimeout(() => playSequenceLine(pendingNext, token), 480);
        });
      }

      function toggleFullConversation() {
        if (fullState === 'playing' || fullState === 'between') {
          if (nextTimer) clearTimeout(nextTimer);
          nextTimer = 0;
          audio.pause();
          fullState = 'paused';
          updateControls();
          return;
        }
        if (fullState === 'paused') {
          fullState = 'playing';
          if (pendingNext >= 0 && audio.ended) playSequenceLine(pendingNext, sequenceToken);
          else audio.resume();
          updateControls();
          return;
        }
        stopSequence();
        const token = sequenceToken;
        playSequenceLine(0, token);
      }

      function playSingle(index) {
        if (mode === 'listen') {
          stopSequence();
        } else {
          practiceIndex = index;
          updatePractice();
        }
        audio.play(index);
      }

      function updatePractice() {
        $('practice-instruction').textContent = `Line ${practiceIndex + 1} of ${lines.length}. Listen, then say it aloud.`;
        $('previous-line').disabled = practiceIndex === 0;
        $('next-line').disabled = practiceIndex === lines.length - 1;
        setActive(practiceIndex);
      }

      function setMode(nextMode) {
        if (mode === nextMode) return;
        const selectedLine = activeIndex;
        stopSequence();
        mode = nextMode;
        const practice = mode === 'practice';
        if (practice && selectedLine >= 0) practiceIndex = selectedLine;
        $('listen-tab').setAttribute('aria-selected', String(!practice));
        $('practice-tab').setAttribute('aria-selected', String(practice));
        $('listen-tab').tabIndex = practice ? -1 : 0;
        $('practice-tab').tabIndex = practice ? 0 : -1;
        $('conversation').setAttribute('aria-labelledby', practice ? 'practice-tab' : 'listen-tab');
        $('conversation-title').textContent = practice ? 'Listen & Repeat' : 'The conversation';
        modeHelp.textContent = practice ? 'Hear one line, say it aloud, then continue.' : 'Play the full exchange or choose any line.';
        $('full-controls').hidden = practice;
        practiceBar.hidden = !practice;
        if (practice) updatePractice();
        status.textContent = '';
      }

      $('listen-tab').addEventListener('click', () => setMode('listen'));
      $('practice-tab').addEventListener('click', () => setMode('practice'));
      document.querySelector('.mode-switch').addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        event.preventDefault();
        const next = mode === 'listen' ? 'practice' : 'listen';
        setMode(next);
        $(next === 'listen' ? 'listen-tab' : 'practice-tab').focus();
      });
      $('toggle-text').addEventListener('click', () => {
        hiddenText = !hiddenText;
        list.querySelectorAll('.bubble').forEach(button => {
          button.querySelector('.line-text').hidden = hiddenText;
        });
        $('toggle-text').textContent = hiddenText ? 'Show dialogue' : 'Hide dialogue';
        $('toggle-text').setAttribute('aria-pressed', String(hiddenText));
      });
      fullButton.addEventListener('click', toggleFullConversation);
      stopButton.addEventListener('click', () => { stopSequence(); status.textContent = 'Stopped.'; });
      $('hear-line').addEventListener('click', () => playSingle(practiceIndex));
      $('previous-line').addEventListener('click', () => { if (practiceIndex > 0) { audio.stop(); practiceIndex--; updatePractice(); } });
      $('next-line').addEventListener('click', () => { if (practiceIndex < lines.length - 1) { audio.stop(); practiceIndex++; updatePractice(); } });

      window.setTheme = theme => { document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; };
      window.stopSlideAudio = () => { stopSequence(); status.textContent = ''; };
      window.resetSlide = () => {
        stopSequence();
        mode = 'practice';
        setMode('listen');
        practiceIndex = 0;
        if (hiddenText) $('toggle-text').click();
        status.textContent = '';
      };
      window.addEventListener('pagehide', window.stopSlideAudio);
      document.addEventListener('visibilitychange', () => { if (document.hidden) window.stopSlideAudio(); });
      updateControls();
    })();
  </script>
</body>
</html>
