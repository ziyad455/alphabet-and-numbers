<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, I'm... | Boston English Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    let initialTheme;
    try {
      if (window.parent !== window) {
        initialTheme = window.parent.document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      }
    } catch {}
    if (!initialTheme) {
      try { initialTheme = localStorage.getItem('editor-theme-preference'); } catch {}
    }
    if (!initialTheme) {
      initialTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.classList.toggle('dark', initialTheme === 'dark');
    window.setTheme = function (theme) {
      document.documentElement.classList.toggle('dark', theme === 'dark');
    };
    window.resetSlide = function () {
      const status = document.getElementById('lesson-status');
      if (status) status.textContent = '';
    };
    window.stopSlideAudio = function () {};
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { color-scheme: light; --page: #f8fafc; --text: #14223a; --muted: #52617c; --border: #d5deeb; --soft: #edf0ff; --accent: #4544c7; --heading-start: #384fc7; --heading-end: #2769cd; }
    :root.dark { color-scheme: dark; --page: #0f172a; --text: #f8fafc; --muted: #becbe0; --border: #374760; --soft: #252c50; --accent: #b2b5ff; --heading-start: #6861f4; --heading-end: #3c79f4; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--text); background: var(--page); }
    .slide { min-height: 100dvh; display: grid; place-items: center; padding: clamp(24px, 5vh, 60px) clamp(20px, 4vw, 64px); background: radial-gradient(ellipse at 4% 5%, rgba(99,102,241,.09), transparent 48%), var(--page); }
    .content { width: 100%; max-width: 1160px; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
    .cover-copy { min-width: 0; }
    .unit-badge { display: inline-flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .1em; }
    .unit-number { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--accent); letter-spacing: 0; }
    .unit-title { margin: 16px 0 36px; color: var(--muted); font-size: clamp(16px, 1.7vw, 20px); font-weight: 600; line-height: 1.5; }
    .lesson-badge { display: block; margin-bottom: 10px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(42px, 5.5vw, 68px); line-height: 1.1; font-weight: 800; letter-spacing: -.055em; background: linear-gradient(100deg,var(--heading-start),var(--heading-end)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .hero { display: block; width: 100%; height: auto; border-radius: 24px; border: 1px solid var(--border); }
    .action-wrap { margin-top: 36px; }
    .start-button { display: inline-flex; align-items: center; justify-content: space-between; gap: 42px; min-height: 58px; padding: 14px 22px; border: 1px solid #7c6dff; border-radius: 14px; background: linear-gradient(110deg,#5949ec,#7431d4); color: #fff; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; transition: filter .15s ease, transform .15s ease; }
    .start-button:hover { filter: brightness(1.1); }
    .start-button:active { transform: translateY(1px); }
    .start-button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 4px; }
    .arrow { font-size: 24px; line-height: 1; }
    .status { margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .status:empty { display: none; }
    @media (max-width: 720px) {
      .slide { padding: 28px 22px; }
      .content { grid-template-columns: 1fr; gap: 24px; max-width: 500px; text-align: center; }
      .unit-title { margin: 12px 0 22px; }
      .action-wrap { margin-top: 24px; }
      .hero { max-height: 34dvh; width: auto; max-width: 100%; margin: auto; }
    }
    @media (max-height: 550px) and (min-width: 721px) { .unit-title { margin-bottom: 20px; } .action-wrap { margin-top: 24px; } }
    @media (prefers-reduced-motion: reduce) { .start-button { transition: none; } }
  </style>
</head>
<body>
  <main class="slide">
    <div class="content">
      <section class="cover-copy" aria-labelledby="lesson-title">
        <div class="unit-badge" aria-label="Unit 1"><span>UNIT</span><span class="unit-number" aria-hidden="true">1</span></div>
        <p class="unit-title">Letters, Numbers and Me</p>
        <span class="lesson-badge">LESSON 2</span>
        <h1 id="lesson-title">Hello, I'm...</h1>
        <div class="action-wrap">
          <button class="start-button" id="start-button" type="button" aria-describedby="lesson-status"><span>Start Lesson</span><span class="arrow" aria-hidden="true">→</span></button>
          <p class="status" id="lesson-status" role="status" aria-live="polite"></p>
        </div>
      </section>
      <img class="hero" src="assets/greeting.png" width="1448" height="1086" alt="Two students smile and wave hello to each other" fetchpriority="high">
    </div>
  </main>
  <script>
    document.getElementById('start-button').addEventListener('click', function () {
      try {
        if (window.parent !== window && window.parent.state?.slides?.[window.parent.state.currentSlide]?.querySelector('iframe') === window.frameElement && window.parent.state.currentSlide < window.parent.state.slides.length - 1) {
          window.parent.nextSlide();
          return;
        }
      } catch {}
      document.getElementById('lesson-status').textContent = 'Open this slide in the reader to start the lesson.';
    });
  </script>
</body>
</html>
