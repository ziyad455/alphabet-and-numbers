<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, I'm... | Boston English Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    let initialTheme;
    try {
      if (window.parent !== window) {
        initialTheme = window.parent.document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      }
    } catch {}
    if (!initialTheme) {
      try { initialTheme = localStorage.getItem('editor-theme-preference'); } catch {}
    }
    if (!initialTheme) {
      initialTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.classList.toggle('dark', initialTheme === 'dark');
    window.setTheme = function (theme) {
      document.documentElement.classList.toggle('dark', theme === 'dark');
    };
    window.resetSlide = function () {
      const status = document.getElementById('lesson-status');
      if (status) status.textContent = '';
    };
    window.stopSlideAudio = function () {};
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --page: #f8fafc;
      --text: #0f172a;
      --heading-start: #384fc7;
      --heading-end: #2769cd;
      --badge-bg: #fff;
      --badge-border: #cbd5e1;
      --badge-text: #334155;
      --status: #475569;
    }
    :root.dark {
      color-scheme: dark;
      --page: #0f172a;
      --text: #f8fafc;
      --heading-start: #6861f4;
      --heading-end: #3c79f4;
      --badge-bg: #172238;
      --badge-border: #344474;
      --badge-text: #e2e8f0;
      --status: #cbd5e1;
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--page);
      color: var(--text);
    }
    .slide {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 3.5vh, 36px) 20px;
      background: radial-gradient(circle at 7% 7%, rgba(79,70,229,.09), transparent 30%), var(--page);
    }
    .dark .slide {
      background: radial-gradient(circle at 7% 7%, rgba(99,102,241,.18), transparent 31%), var(--page);
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(11px, 2.2vh, 22px);
      width: 100%;
      max-width: 850px;
      text-align: center;
    }
    .unit-badge {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-height: 44px;
      padding: 7px 9px 7px 18px;
      border: 1px solid var(--badge-border);
      border-radius: 30px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .unit-number {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: #5044e9;
      color: #fff;
      letter-spacing: 0;
    }
    .unit-title {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 29px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -.035em;
    }
    .lesson-line {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px 16px;
    }
    .lesson-badge {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 8px 22px;
      border: 1px solid #7c6dff;
      border-radius: 30px;
      background: linear-gradient(110deg, #8e34e8, #4156e9);
      color: #fff;
      font-size: clamp(15px, 1.5vw, 21px);
      font-weight: 800;
      letter-spacing: .09em;
      white-space: nowrap;
    }
    h1 {
      margin: 0;
      background: linear-gradient(100deg, var(--heading-start), var(--heading-end));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: clamp(37px, 5vw, 62px);
      font-weight: 800;
      line-height: 1.07;
      letter-spacing: -.055em;
    }
    .hero {
      display: block;
      width: min(100%, 590px, 64dvh);
      height: auto;
      object-fit: contain;
      border-radius: 29% 32% 30% 33% / 28% 29% 27% 30%;
    }
    .action-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }
    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-width: min(320px, calc(100vw - 40px));
      min-height: 68px;
      padding: 12px 23px;
      border: 1px solid #8273ff;
      border-radius: 15px;
      background: linear-gradient(110deg, #5949ec, #7431d4);
      box-shadow: 0 10px 22px rgba(79,70,229,.16);
      color: #fff;
      font: inherit;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      transition: filter .15s ease, transform .15s ease;
    }
    .start-button:hover { filter: brightness(1.1); }
    .start-button:active { transform: scale(.98); }
    .start-button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    .arrow {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 50%;
      background: rgba(255,255,255,.14);
      font-size: 24px;
      line-height: 1;
    }
    .status {
      min-height: 1.3em;
      margin: 0;
      color: var(--status);
      font-size: 13px;
      font-weight: 600;
    }
    @media (max-width: 600px), (max-height: 700px) {
      .content { gap: 11px; }
      .slide { padding-block: 17px; }
      .hero { width: min(100%, 590px, 52dvh); }
      .start-button { min-height: 55px; font-size: 16px; }
      .lesson-badge { min-height: 40px; padding-block: 6px; }
      .arrow { width: 30px; height: 30px; font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .start-button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="slide">
    <div class="content">
      <div class="unit-badge" aria-label="Unit 1"><span>UNIT</span><span class="unit-number" aria-hidden="true">1</span></div>
      <p class="unit-title">Letters, Numbers and Me</p>
      <div class="lesson-line">
        <span class="lesson-badge">LESSON 2</span>
        <h1>Hello, I'm...</h1>
      </div>
      <img class="hero" src="assets/greeting.png" width="1448" height="1086" alt="Two students smile and wave hello to each other">
      <div class="action-wrap">
        <button class="start-button" id="start-button" type="button" aria-describedby="lesson-status">
          <span>Start Lesson</span><span class="arrow" aria-hidden="true">→</span>
        </button>
        <p class="status" id="lesson-status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('start-button').addEventListener('click', function () {
      try {
        if (window.parent !== window && window.parent.state?.slides?.[window.parent.state.currentSlide]?.querySelector('iframe') === window.frameElement && window.parent.state.currentSlide < window.parent.state.slides.length - 1) {
          window.parent.nextSlide();
          return;
        }
      } catch {}
      document.getElementById('lesson-status').textContent = 'Open this slide in the reader to start the lesson.';
    });
  </script>
</body>
</html>
