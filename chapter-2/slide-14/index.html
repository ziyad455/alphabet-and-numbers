<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Exit Ticket | Boston English Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (() => {
      let theme = null;
      try {
        if (parent !== window) theme = parent.document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      } catch (_) {}
      if (!theme) { try { theme = localStorage.getItem('editor-theme-preference'); } catch (_) {} }
      if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', theme === 'dark');
      window.setTheme = next => document.documentElement.classList.toggle('dark', next === 'dark');
    })();
  </script>
<style>
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
:root{color-scheme:light;--bg:#f8fafc;--card:#fff;--text:#14223a;--muted:#566983;--border:#d5deeb;--soft:#eef1ff;--accent:#554ae6;--start:#384fc7;--end:#2769cd;--good:#007f56;--good-bg:#dcfaeb;--bad:#aa3655}
:root.dark{color-scheme:dark;--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#c0cce0;--border:#374760;--soft:#2b3557;--accent:#a5adff;--start:#6861f4;--end:#3c79f4;--good:#9af1c1;--good-bg:#153e35;--bad:#ff9eaf}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:4px}button:disabled{cursor:default}
main{min-height:100dvh;padding:clamp(24px,4vh,48px) clamp(16px,4vw,54px);background:radial-gradient(circle at 4% 4%,rgba(99,102,241,.12),transparent 32%),var(--bg);display:flex;align-items:center;justify-content:center}.content{width:100%;max-width:1080px}header{text-align:center;margin-bottom:24px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.13em;margin:0 0 10px}h1{font-size:clamp(34px,5vw,62px);line-height:1.12;letter-spacing:-.05em;margin:0;background:linear-gradient(105deg,var(--start),var(--end));background-clip:text;-webkit-background-clip:text;color:transparent} .subtitle{color:var(--muted);font-size:clamp(14px,1.5vw,18px);line-height:1.6;margin:12px 0 0}.primary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 26px;border:1px solid #7c6dff;border-radius:14px;background:linear-gradient(110deg,#5949ec,#7431d4);color:white;font-weight:800}.primary:hover{filter:brightness(1.1)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}.status{text-align:center;color:var(--muted);font-size:14px;min-height:1.5em;margin:14px 0 0}
fieldset{margin:0 0 14px;border:1px solid var(--border);border-radius:20px;padding:18px 22px;background:var(--card);min-width:0}legend{float:left;width:100%;padding:0;margin:0 0 15px;font-size:clamp(17px,2vw,23px);font-weight:800;line-height:1.5}.number{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);font-size:14px;margin-right:12px}.options{clear:both;display:flex;gap:12px;flex-wrap:wrap}.option{display:flex;align-items:center;gap:9px;padding:10px 16px;min-height:46px;border:1px solid var(--border);border-radius:11px;font-weight:700;cursor:pointer}.option:has(input:checked){background:var(--soft);border-color:var(--accent)}input{accent-color:var(--accent);width:17px;height:17px;margin:0}.feedback{margin:12px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}.correct{border-color:var(--good);background:var(--good-bg)}.correct .feedback{color:var(--good)}.incorrect .feedback{color:var(--bad)}.speaker{margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-height:42px;background:var(--card);color:var(--text);display:inline-flex;align-items:center;gap:8px;font-weight:700}.speaker svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.speaker.speaking{border-color:var(--accent);background:var(--soft)}@media(max-width:500px){fieldset{padding:16px}.option{padding:10px 12px;flex:1}.options{gap:8px}.number{margin-right:6px}}
</style></head><body><main><div class="content"><header><p class="eyebrow">EXIT TICKET</p><h1>One Last Challenge!</h1><p class="subtitle">Choose the correct word to complete each sentence.</p></header><form id="quiz"><fieldset id="question-0"><legend><span class="number">01</span>Sara is from Egypt. ___ an engineer.</legend><div class="options"><label class="option"><input type="radio" name="q0" value="0"><span>A. He's</span></label><label class="option"><input type="radio" name="q0" value="1"><span>B. She's</span></label><label class="option"><input type="radio" name="q0" value="2"><span>C. I'm</span></label></div><p class="feedback" id="feedback-0" role="status"></p><button type="button" class="speaker" id="speaker-0" hidden aria-label="Hear the complete sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5zM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg>Listen</button></fieldset><fieldset id="question-1"><legend><span class="number">02</span>Hello! ___ Ahmed. I'm a teacher.</legend><div class="options"><label class="option"><input type="radio" name="q1" value="0"><span>A. I'm</span></label><label class="option"><input type="radio" name="q1" value="1"><span>B. You're</span></label><label class="option"><input type="radio" name="q1" value="2"><span>C. He's</span></label></div><p class="feedback" id="feedback-1" role="status"></p><button type="button" class="speaker" id="speaker-1" hidden aria-label="Hear the complete sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5zM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg>Listen</button></fieldset><fieldset id="question-2"><legend><span class="number">03</span>This is Omar. ___ a doctor.</legend><div class="options"><label class="option"><input type="radio" name="q2" value="0"><span>A. She's</span></label><label class="option"><input type="radio" name="q2" value="1"><span>B. You're</span></label><label class="option"><input type="radio" name="q2" value="2"><span>C. He's</span></label></div><p class="feedback" id="feedback-2" role="status"></p><button type="button" class="speaker" id="speaker-2" hidden aria-label="Hear the complete sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5zM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg>Listen</button></fieldset><p class="status" id="progress" role="status" aria-live="polite">0 of 3 correct</p><div class="actions"><button class="primary" id="check" type="submit">Check Answers</button><button class="primary" id="finish" type="button" hidden>Finish Lesson →</button></div><p class="status" id="navigation-status" role="status"></p></form></div></main><script>const questions=[["Sara is from Egypt. ___ an engineer.", ["He's", "She's", "I'm"], 1, "Sara is from Egypt. She's an engineer."], ["Hello! ___ Ahmed. I'm a teacher.", ["I'm", "You're", "He's"], 0, "Hello! I'm Ahmed. I'm a teacher."], ["This is Omar. ___ a doctor.", ["She's", "You're", "He's"], 2, "This is Omar. He's a doctor."]];
const solved=new Set();let currentSpeech=null;const $=id=>document.getElementById(id);
function stopSpeech(){currentSpeech=null;if('speechSynthesis' in window)speechSynthesis.cancel();document.querySelectorAll('.speaker').forEach(b=>b.classList.remove('speaking'))}
window.stopSlideAudio=stopSpeech;
questions.forEach((q,i)=>{document.querySelectorAll(`[name="q${i}"]`).forEach(input=>input.addEventListener('change',()=>{if(!solved.has(i)){$(`question-${i}`).classList.remove('incorrect');$(`feedback-${i}`).textContent=''}}));$(`speaker-${i}`).addEventListener('click',()=>{stopSpeech();if(!('speechSynthesis' in window)){$('progress').textContent='Speech playback is unavailable in this browser.';return}const u=new SpeechSynthesisUtterance(q[3]);currentSpeech=u;u.lang='en-GB';u.rate=.82;u.voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()==='en-gb')||null;u.onstart=()=>{if(currentSpeech===u)$(`speaker-${i}`).classList.add('speaking')};u.onend=u.onerror=()=>{if(currentSpeech===u)$(`speaker-${i}`).classList.remove('speaking')};speechSynthesis.speak(u)})});
$('quiz').addEventListener('submit',event=>{event.preventDefault();questions.forEach((q,i)=>{if(solved.has(i))return;const selected=document.querySelector(`[name="q${i}"]:checked`);const correct=selected && Number(selected.value)===q[2];$(`question-${i}`).classList.toggle('incorrect',!correct);if(correct){solved.add(i);$(`question-${i}`).classList.add('correct');$(`feedback-${i}`).textContent='✓ Correct! '+q[3];$(`speaker-${i}`).hidden=false;document.querySelectorAll(`[name="q${i}"]`).forEach(input=>input.disabled=true)}else{$(`feedback-${i}`).textContent=selected?'Try again. Choose a different word.':'Choose an answer first.'}});$('progress').textContent=solved.size===3?'3 of 3 correct. Great work! You are ready to finish the lesson.':`${solved.size} of 3 correct`;$('finish').hidden=solved.size!==3;$('check').hidden=solved.size===3;if(solved.size===3)$('finish').focus()});
window.resetSlide=()=>{stopSpeech();solved.clear();$('quiz').reset();questions.forEach((q,i)=>{$(`question-${i}`).classList.remove('correct','incorrect');$(`feedback-${i}`).textContent='';$(`speaker-${i}`).hidden=true;document.querySelectorAll(`[name="q${i}"]`).forEach(input=>input.disabled=false)});$('progress').textContent='0 of 3 correct';$('check').hidden=false;$('finish').hidden=true;$('navigation-status').textContent=''};
function navigateTo(path,status){try{const reader=window.parent;if(reader!==window && typeof reader.goToSlidePath==='function' && reader.goToSlidePath(path))return;}catch(_){}document.getElementById(status).textContent='Open this lesson in the reader to continue.';}$('finish').addEventListener('click',()=>navigateTo('chapter-2/slide-15/index.html','navigation-status'));window.addEventListener('pagehide',stopSpeech);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech()});</script></body></html>
