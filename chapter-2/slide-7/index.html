<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Did You Understand? | Boston English Center</title>
  <link rel="stylesheet" href="../shared/dialogue-base.css">
  <style>
    .slide-inner { max-width: 980px; }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 16px; }
    .step-label { color: var(--muted); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .top-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .top-buttons button { min-height: 42px; }
    .progress-track { height: 7px; background: var(--surface-raised); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--blue); transition: width .3s ease; }
    .activity {
      padding: clamp(18px, 3vw, 34px); border-radius: 24px; border: 1px solid var(--line);
      background: var(--surface);
    }
    .question-kicker { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    .question-title { margin: 8px 0 20px; font-size: clamp(27px, 3vw, 39px); line-height: 1.2; letter-spacing: -.045em; }
    .listen-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; margin-bottom: 20px; border: 1px solid var(--line);
      border-radius: 14px; background: var(--surface-raised);
    }
    .listen-row p { margin: 0; color: var(--muted); font-size: 14px; font-weight: 700; }
    .listen-row button { display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; }
    .answer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .answer {
      width: 100%; min-height: 91px; display: flex; align-items: center; gap: 15px;
      padding: 14px 18px; background: var(--surface-raised); color: var(--text);
      border: 2px solid var(--line); border-radius: 16px; text-align: left;
      font-size: clamp(18px, 1.7vw, 24px); font-weight: 800; letter-spacing: -.03em;
      transition: border-color .18s, background-color .18s, transform .18s;
    }
    .answer:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--blue); }
    .answer[data-result='wrong'] { border-color: var(--wrong); }
    .answer[data-result='correct'] { border-color: var(--right); background: color-mix(in srgb, var(--surface-raised) 87%, var(--right)); }
    .answer-portrait { display: grid; place-items: center; width: 62px; height: 62px; overflow: hidden; border-radius: 11px; font-size: 24px; }
    .answer-portrait img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .answer-label { flex: 1; }
    .feedback-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 18px; }
    .feedback { margin: 0; color: var(--muted); font-size: 16px; font-weight: 700; line-height: 1.45; }
    .feedback[data-result='correct'] { color: var(--right); }
    .feedback[data-result='wrong'] { color: var(--wrong); }
    .completion { text-align: center; padding: clamp(26px, 5vw, 60px) 20px; }
    .completion-mark { width: 72px; height: 72px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 50%; background: var(--right); color: var(--bg); font-size: 34px; font-weight: 800; }
    .completion h2 { margin: 0; font-size: clamp(31px, 4vw, 47px); letter-spacing: -.05em; }
    .completion p { max-width: 510px; margin: 12px auto 22px; color: var(--muted); font-size: 17px; line-height: 1.55; }
    .completion button { margin: 0 5px; }
    .audio-status { min-height: 22px; margin: 14px 0 0; text-align: center; color: var(--muted); font-size: 13px; font-weight: 700; }
    .transcript-dialog {
      width: min(640px, calc(100vw - 28px)); max-height: min(84vh, 760px); padding: 0;
      border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--text);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }
    .transcript-dialog::backdrop { background: rgba(5, 12, 29, .7); }
    .transcript-top { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 22px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .transcript-top h2 { margin: 0; font-size: 22px; letter-spacing: -.04em; }
    .transcript-top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .close-dialog { display: grid; place-items: center; width: 38px; height: 38px; flex: none; border: 1px solid var(--line); border-radius: 50%; background: var(--surface-raised); color: var(--text); font-size: 23px; }
    .transcript-lines { padding: 16px 20px 22px; display: grid; gap: 9px; }
    .transcript-line { width: 100%; display: flex; align-items: center; gap: 11px; min-height: 62px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-raised); color: var(--text); text-align: left; }
    .transcript-line:hover { border-color: var(--blue); }
    .transcript-line[data-active='true'] { border-color: var(--blue); }
    .transcript-line span:nth-child(2) { flex: 1; }
    .transcript-line strong { display: block; margin-bottom: 2px; color: var(--soft); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .transcript-line em { display: block; font-size: 16px; font-style: normal; font-weight: 700; line-height: 1.35; }
    @media (max-width: 600px) {
      .slide-shell { padding: 18px 14px 28px; }
      .slide-heading h1 { font-size: clamp(34px, 8vw, 44px); }
      .top-row { align-items: flex-start; flex-direction: column; }
      .top-buttons { width: 100%; }
      .top-buttons button { flex: 1; }
      .activity { border-radius: 18px; }
      .listen-row { align-items: flex-start; flex-direction: column; }
      .listen-row button { width: 100%; justify-content: center; }
      .answer-grid { gap: 9px; }
      .answer { min-height: 78px; padding: 10px 12px; gap: 8px; font-size: 17px; }
      .answer-portrait { width: 42px; height: 49px; flex: none; }
      .feedback-row { align-items: stretch; flex-direction: column; }
      .feedback-row button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="slide-shell">
    <div class="slide-inner">
      <header class="slide-heading">
        <h1>Did You Understand?</h1>
        <p>Listen again and choose the correct answers.</p>
      </header>

      <div class="top-row">
        <span class="step-label" id="step-label">Question 1 of 5</span>
        <div class="top-buttons">
          <button class="secondary-button" id="read-dialogue" type="button">Read conversation</button>
          <button class="text-button" id="reset-activity" type="button">Start Again</button>
        </div>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

      <section class="activity" id="question-panel" aria-labelledby="question-title">
        <span class="question-kicker">Listen & Choose</span>
        <h2 class="question-title" id="question-title"></h2>
        <div class="listen-row">
          <p>Hear the line from the conversation.</p>
          <button class="secondary-button" id="hear-question" type="button"><svg class="speaker-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"></path></svg>Play line</button>
        </div>
        <div class="answer-grid" id="answers" role="group" aria-label="Choose one answer"></div>
        <div class="feedback-row" id="feedback-row" hidden>
          <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
          <button class="primary-button" id="next-question" type="button" hidden>Next question</button>
        </div>
      </section>

      <section class="activity completion" id="completion" hidden aria-labelledby="completion-title">
        <div class="completion-mark" aria-hidden="true">✓</div>
        <h2 id="completion-title" tabindex="-1">Well done!</h2>
        <p>You listened to Ahmed and Sara and understood their conversation.</p>
        <button class="primary-button" id="restart-completion" type="button">Start Again</button>
        <button class="secondary-button" id="read-completion" type="button">Read conversation</button>
      </section>
      <p class="audio-status" id="audio-status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <dialog class="transcript-dialog" id="transcript-dialog" aria-labelledby="transcript-heading">
    <div class="transcript-top">
      <div><h2 id="transcript-heading">Ahmed and Sara</h2><p>Read the conversation. Choose any line to hear it.</p></div>
      <button class="close-dialog" id="close-transcript" type="button" aria-label="Close conversation">×</button>
    </div>
    <div class="transcript-lines" id="transcript-lines"></div>
  </dialog>

  <script src="../shared/dialogue-data.js"></script>
  <script src="../shared/dialogue-audio.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const lines = window.BEC_DIALOGUE.lines;
      const portrait = window.BEC_DIALOGUE.portraits;
      const speakerSvg = '<svg class="speaker-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"></path></svg>';
      const questions = [
        { prompt: 'Who asks, “Where are you from?”', line: 4, options: ['Ahmed', 'Sara'], answer: 'Ahmed', feedback: 'Correct. Ahmed asks the question.', people: true },
        { prompt: 'Where is Sara from?', line: 5, options: ['Egypt', 'Jordan'], answer: 'Egypt', feedback: 'Correct. Sara is from Egypt.' },
        { prompt: 'What is Ahmed’s job?', line: 8, options: ['A teacher', 'An engineer'], answer: 'A teacher', feedback: 'Correct. Ahmed is a teacher.' },
        { prompt: 'Who says, “I’m an engineer”?', line: 9, options: ['Ahmed', 'Sara'], answer: 'Sara', feedback: 'Correct. Sara says this.', people: true },
        { prompt: 'Complete Sara’s goodbye: “Bye! See ___!”', line: 11, options: ['you', 'me'], answer: 'you', feedback: 'Correct. Sara says, “Bye! See you!”' },
      ];
      const audio = window.createDialogueAudio('../slide-6/assets/audio/', onAudioState);
      const answerBox = $('answers');
      const feedback = $('feedback');
      const dialog = $('transcript-dialog');
      let questionIndex = 0;
      let answered = false;

      function onAudioState(state, index) {
        $('audio-status').textContent = state === 'error' ? 'This audio could not play. Please try again.'
          : state === 'playing' ? `${lines[index].speaker === 'ahmed' ? 'Ahmed' : 'Sara'} is speaking.` : '';
        $('transcript-lines').querySelectorAll('.transcript-line').forEach((button, i) => {
          button.dataset.active = String(state === 'playing' && i === index);
        });
        $('hear-question').setAttribute('aria-label', state === 'playing' && index === questions[questionIndex].line ? 'Replay line' : 'Play line');
      }

      function makeAnswer(value, isPerson) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer';
        button.dataset.value = value;
        if (isPerson) {
          const who = value.toLowerCase();
          const photo = document.createElement('span');
          photo.className = 'answer-portrait photo-fallback';
          photo.innerHTML = `<span aria-hidden="true">${value[0]}</span><img alt="" src="${portrait[who]}" loading="lazy" onerror="this.hidden=true">`;
          button.appendChild(photo);
        }
        const label = document.createElement('span');
        label.className = 'answer-label';
        label.textContent = value;
        button.appendChild(label);
        button.addEventListener('click', () => chooseAnswer(value, button));
        return button;
      }

      function renderQuestion() {
        const question = questions[questionIndex];
        answered = false;
        $('question-panel').hidden = false;
        $('completion').hidden = true;
        $('step-label').textContent = `Question ${questionIndex + 1} of ${questions.length}`;
        $('question-title').textContent = question.prompt;
        answerBox.replaceChildren(...question.options.map(value => makeAnswer(value, question.people)));
        feedback.textContent = '';
        feedback.removeAttribute('data-result');
        $('feedback-row').hidden = true;
        $('next-question').hidden = true;
        $('next-question').textContent = questionIndex === questions.length - 1 ? 'Finish' : 'Next question';
        if (questionIndex === 0) $('progress-fill').style.transition = 'none';
        $('progress-fill').style.width = `${questionIndex / questions.length * 100}%`;
        if (questionIndex === 0) requestAnimationFrame(() => { $('progress-fill').style.transition = ''; });
        $('progress-track').setAttribute('aria-valuenow', questionIndex);
      }

      function chooseAnswer(value, button) {
        if (answered) return;
        const question = questions[questionIndex];
        $('feedback-row').hidden = false;
        if (value !== question.answer) {
          button.dataset.result = 'wrong';
          button.disabled = true;
          feedback.dataset.result = 'wrong';
          feedback.textContent = 'Not yet. Listen and try again.';
          return;
        }
        answered = true;
        button.dataset.result = 'correct';
        answerBox.querySelectorAll('button').forEach(option => { option.disabled = true; });
        feedback.dataset.result = 'correct';
        feedback.textContent = question.feedback;
        $('next-question').hidden = false;
        $('next-question').focus();
        $('progress-fill').style.width = `${(questionIndex + 1) / questions.length * 100}%`;
        $('progress-track').setAttribute('aria-valuenow', questionIndex + 1);
      }

      function showCompletion() {
        audio.stop();
        $('progress-fill').style.transition = 'none';
        $('progress-fill').style.width = '100%';
        $('question-panel').hidden = true;
        $('completion').hidden = false;
        $('step-label').textContent = `${questions.length} of ${questions.length} questions complete`;
        $('completion-title').focus();
      }

      function reset() {
        audio.stop();
        if (dialog.open) dialog.close();
        questionIndex = 0;
        renderQuestion();
        $('audio-status').textContent = '';
      }

      lines.forEach((line, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'transcript-line';
        button.dataset.active = 'false';
        button.setAttribute('aria-label', `Play ${line.speaker === 'ahmed' ? 'Ahmed' : 'Sara'}'s line ${index + 1}: ${line.text}`);
        const number = document.createElement('span');
        number.className = 'step-label';
        number.textContent = String(index + 1).padStart(2, '0');
        const copy = document.createElement('span');
        const name = document.createElement('strong');
        name.textContent = line.speaker;
        const text = document.createElement('em');
        text.textContent = line.text;
        copy.append(name, text);
        const icon = document.createElement('span');
        icon.innerHTML = speakerSvg;
        button.append(number, copy, icon);
        button.addEventListener('click', () => audio.play(index));
        $('transcript-lines').appendChild(button);
      });

      $('hear-question').addEventListener('click', () => audio.play(questions[questionIndex].line));
      $('next-question').addEventListener('click', () => {
        if (!answered) return;
        audio.stop();
        if (questionIndex === questions.length - 1) showCompletion();
        else { questionIndex++; renderQuestion(); }
      });
      $('reset-activity').addEventListener('click', reset);
      $('restart-completion').addEventListener('click', reset);
      function openTranscript() { audio.stop(); dialog.showModal(); $('close-transcript').focus(); }
      $('read-dialogue').addEventListener('click', openTranscript);
      $('read-completion').addEventListener('click', openTranscript);
      $('close-transcript').addEventListener('click', () => dialog.close());
      dialog.addEventListener('close', () => audio.stop());
      dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });

      window.setTheme = theme => { document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'; };
      window.stopSlideAudio = () => { audio.stop(); $('audio-status').textContent = ''; };
      window.resetSlide = reset;
      window.addEventListener('pagehide', window.stopSlideAudio);
      document.addEventListener('visibilitychange', () => { if (document.hidden) window.stopSlideAudio(); });
      renderQuestion();
    })();
  </script>
</body>
</html>
