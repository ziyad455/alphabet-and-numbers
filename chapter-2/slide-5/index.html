<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speaking Practice — Hello, I'm... | Boston English Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      let theme = null;
      try {
        if (window.parent !== window) {
          theme = window.parent.document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }
      } catch (_) {}
      if (!theme) {
        try { theme = localStorage.getItem('editor-theme-preference'); } catch (_) {}
      }
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.toggle('dark', theme === 'dark');
      window.setTheme = function (next) {
        document.documentElement.classList.toggle('dark', next === 'dark');
      };
      window.stopSlideAudio = function () {};
      window.resetSlide = function () {};
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --page: #f8fafc;
      --surface: #ffffff;
      --text: #14223a;
      --muted: #5c6c84;
      --border: #d6dfed;
      --heading-start: #384fc7;
      --heading-end: #2769cd;
      --label: #4f46e5;
      --shadow: 0 14px 36px rgba(24,38,77,.065);
      --footer-bg: #edf2ff;
      --footer-text: #3f4d87;
    }
    :root.dark {
      color-scheme: dark;
      --page: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #b4c3d8;
      --border: #354561;
      --heading-start: #6861f4;
      --heading-end: #3c79f4;
      --label: #a5b4fc;
      --shadow: 0 14px 36px rgba(0,0,0,.13);
      --footer-bg: #243456;
      --footer-text: #d4dafa;
    }
    html,body { margin:0; min-height:100%; }
    body { background: var(--page); color: var(--text); font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
    .slide {
      min-height:100dvh;
      display:flex;
      align-items:center;
      padding: clamp(23px,3vh,44px) clamp(15px,3vw,44px);
      background:
        radial-gradient(ellipse at 5% 7%,rgba(102,101,246,.13),transparent 33%),
        radial-gradient(ellipse at 94% 90%,rgba(48,144,228,.075),transparent 30%),
        var(--page);
    }
    .layout { width:100%; max-width:1280px; margin:0 auto; }
    .heading { text-align:center; margin:0 auto clamp(20px,3vh,32px); }
    .eyebrow {
      margin:0 0 8px;
      color:var(--label); font-size:clamp(11px,1.1vw,13px);
      font-weight:800; letter-spacing:.15em; text-transform:uppercase;
    }
    h1 {
      margin:0;
      font-size:clamp(40px,5.15vw,76px);
      line-height:1.1; font-weight:800; letter-spacing:-.06em;
      background:linear-gradient(105deg,var(--heading-start),var(--heading-end));
      background-clip:text; -webkit-background-clip:text; color:transparent;
    }
    .subtitle {
      color:var(--muted); font-size:clamp(14px,1.5vw,18px);
      font-weight:600; line-height:1.6;
      margin:12px auto 0; max-width:810px;
    }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(13px,1.6vw,23px); }
    .card {
      min-width:0; border:1px solid var(--border); border-radius:24px;
      background:var(--surface); box-shadow:var(--shadow); overflow:hidden;
      display:flex; flex-direction:column;
      cursor:pointer; transition:border-color .18s ease, box-shadow .18s ease;
    }
    .card:hover, .card:focus-visible { border-color:var(--heading-end); }
    .card:focus-visible { outline:3px solid #f59e0b; outline-offset:3px; }
    .card.speaking { border-color:var(--heading-end); box-shadow:0 0 0 3px rgba(79,70,229,.18),var(--shadow); }
    .speaker-indicator {
      position:absolute; top:15px; right:15px; z-index:1;
      display:grid; place-items:center; width:32px; height:32px;
      border:1px solid var(--border); border-radius:50%;
      color:var(--muted); background:var(--surface);
    }
    .speaker-indicator svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .card.speaking .speaker-indicator { color:var(--heading-end); border-color:var(--heading-end); }
    .visual {
      position:relative;
      height:clamp(175px,19.5vw,270px);
      background:#e4e6ff; overflow:hidden;
    }
    .visual img { display:block; width:100%; height:100%; object-fit:cover; object-position:center 40%; }
    .card:nth-child(1) .visual img { object-position:center 38%; }
    .card:nth-child(2) .visual img { object-position:center 39%; }
    .card:nth-child(3) .visual img { object-position:center 40%; }
    .visual::after {
      content:""; position:absolute; inset:auto 0 0; height:45%;
      background:linear-gradient(to bottom,transparent,rgba(9,19,41,.13)); pointer-events:none;
    }
    .number {
      position:absolute; top:15px; left:15px; z-index:1;
      display:grid; place-items:center; width:41px; height:41px;
      background:rgba(255,255,255,.95); color:#334dc3;
      border:1px solid rgba(255,255,255,.8); border-radius:13px;
      font-size:15px; font-weight:800; box-shadow:0 5px 18px rgba(25,28,84,.14);
    }
    .card-content {
      min-height:166px; padding:clamp(18px,2vw,28px) clamp(17px,2vw,25px) 24px;
      display:flex; flex-direction:column; gap:10px;
    }
    .topic {
      font-size:clamp(11px,1.03vw,13px); font-weight:800; letter-spacing:.10em;
      text-transform:uppercase; color:var(--label); margin:0;
    }
    .question {
      margin:0; font-size:clamp(18px,2.05vw,27px); line-height:1.36;
      letter-spacing:-.035em; font-weight:800; color:var(--text);
    }
    .speaking-hint {
      display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
      gap:8px 14px; max-width:860px; margin:clamp(18px,3vh,30px) auto 0;
      border:1px solid var(--border); background:var(--footer-bg);
      padding:12px 18px; border-radius:999px;
      color:var(--footer-text); font-size:clamp(12px,1.1vw,14px); font-weight:700; text-align:center;
    }
    .speaking-hint .dot { color:#6553df; font-size:17px; line-height:1; }
    @media (max-width:760px) {
      .slide { align-items:flex-start; }
      .cards { grid-template-columns:1fr; max-width:530px; margin:auto; }
      .card { display:grid; grid-template-columns:40% minmax(0,1fr); align-items:stretch; min-height:175px; }
      .visual { height:100%; min-height:175px; }
      .visual img { object-position:center 36%; }
      .card-content { min-height:0; padding:18px 16px; justify-content:center; }
      .question { font-size:clamp(17px,3.2vw,24px); }
      .heading { margin-bottom:22px; }
      .speaking-hint { max-width:530px; border-radius:16px; }
    }
    @media (max-width:410px) {
      .card { grid-template-columns:35% minmax(0,1fr); min-height:180px; }
      .question { font-size:17px; }
      .visual { min-height:180px; }
      .number { width:31px; height:31px; font-size:12px; top:8px; left:8px; }
      .speaker-indicator { top:8px; right:8px; }
      .card-content { padding:12px; }
    }
    @media (prefers-reduced-motion:reduce) { .card { transition:none; } }
  </style>
</head>
<body>
  <main class="slide">
    <div class="layout">
      <header class="heading">
        <p class="eyebrow">Lesson 2 · Speaking Practice</p>
        <h1>Let's Talk!</h1>
        <p class="subtitle">Click a question to hear it.</p>
      </header>
      <!-- Real Pexels photographs (no AI-generated assets):
           Greetings: https://www.pexels.com/photo/women-waving-at-each-other-5537584/
           Country: https://www.pexels.com/photo/a-man-holding-a-globe-8542365/
           Work: https://www.pexels.com/photo/photography-of-a-woman-using-laptop-1181292/
           Licensed under the Pexels License: https://www.pexels.com/license/ -->
      <section class="cards" aria-label="Three speaking practice questions">
        <article class="card" role="button" tabindex="0" aria-label="Play question: How do you say hello in your country?" data-question="How do you say hello in your country?">
          <div class="visual">
            <img src="https://images.pexels.com/photos/5537584/pexels-photo-5537584.jpeg?auto=compress&cs=tinysrgb&w=1000" alt="Two students smiling and waving hello to each other" width="1000" height="667" decoding="async">
            <span class="number" aria-hidden="true">01</span>
            <span class="speaker-indicator" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15 9a5 5 0 0 1 0 6"></path><path d="M18 6a9 9 0 0 1 0 12"></path></svg></span>
          </div>
          <div class="card-content">
            <p class="topic">Greetings</p>
            <h2 class="question">How do you say “hello” in your country?</h2>
          </div>
        </article>
        <article class="card" role="button" tabindex="0" aria-label="Play question: Where are you from?" data-question="Where are you from?">
          <div class="visual">
            <img src="https://images.pexels.com/photos/8542365/pexels-photo-8542365.jpeg?auto=compress&cs=tinysrgb&w=1000" alt="A person holding a globe, representing countries and places" width="1000" height="667" decoding="async">
            <span class="number" aria-hidden="true">02</span>
            <span class="speaker-indicator" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15 9a5 5 0 0 1 0 6"></path><path d="M18 6a9 9 0 0 1 0 12"></path></svg></span>
          </div>
          <div class="card-content">
            <p class="topic">Your Home</p>
            <h2 class="question">Where are you from?</h2>
          </div>
        </article>
        <article class="card" role="button" tabindex="0" aria-label="Play question: What do you do?" data-question="What do you do?">
          <div class="visual">
            <img src="https://images.pexels.com/photos/1181292/pexels-photo-1181292.jpeg?auto=compress&cs=tinysrgb&w=1000" alt="A smiling professional working on a laptop" width="1000" height="667" decoding="async">
            <span class="number" aria-hidden="true">03</span>
            <span class="speaker-indicator" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15 9a5 5 0 0 1 0 6"></path><path d="M18 6a9 9 0 0 1 0 12"></path></svg></span>
          </div>
          <div class="card-content">
            <p class="topic">Work or Studies</p>
            <h2 class="question">What do you do?</h2>
          </div>
        </article>
      </section>
      <p class="speaking-hint" aria-label="Speaking tips">
        <span>Speak clearly</span><span class="dot" aria-hidden="true">•</span>
        <span>Listen to your classmates</span><span class="dot" aria-hidden="true">•</span>
        <span>Take your time</span>
      </p>
    </div>
  </main>
  <script>
    const cards = Array.from(document.querySelectorAll('.card'));
    let playbackId = 0;

    function stopQuestion() {
      playbackId++;
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      cards.forEach(card => card.classList.remove('speaking'));
    }

    function playQuestion(card) {
      stopQuestion();
      if (!('speechSynthesis' in window)) return;
      const id = playbackId;
      const utterance = new SpeechSynthesisUtterance(card.dataset.question);
      utterance.lang = 'en-GB';
      utterance.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      utterance.voice = voices.find(voice => voice.lang.toLowerCase() === 'en-gb') || null;
      card.classList.add('speaking');
      const clear = () => { if (id === playbackId) card.classList.remove('speaking'); };
      utterance.onend = clear;
      utterance.onerror = clear;
      speechSynthesis.speak(utterance);
    }

    cards.forEach(card => {
      card.addEventListener('click', () => playQuestion(card));
      card.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          playQuestion(card);
        }
      });
    });
    window.stopSlideAudio = stopQuestion;
    window.resetSlide = stopQuestion;
    window.addEventListener('pagehide', stopQuestion);
  </script>
</body>
</html>
